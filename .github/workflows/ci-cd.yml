name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install System Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Pre-build Search Index Database
        run: |
          python3 workflow_db.py --index --force || true

      - name: Test Application Startup Configuration
        run: |
          timeout 30 python3 run.py --host 127.0.0.1 --port 8001 &
          SERVER_PID=$!
          
          echo "Waiting for localized server instance initialization..."
          for i in {1..20}; do
            if curl -f http://127.0.0.1:8001/api/stats 2>/dev/null; then
              echo "Automated Engine Check: Server is fully operational!"
              break
            fi
            if [ $i -eq 20 ]; then
              echo "Error: Validation tracking timed out after 20 seconds."
              exit 1
            fi
            sleep 1
          done
          
          kill $SERVER_PID 2>/dev/null || true
